name = "ml-telegram-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Define your D1 Database binding
[[d1_databases]]
binding = "DB" # This name must match Env.DB in code
database_name = "ml_bot_db"
database_id = "<YOUR_D1_DATABASE_ID>" 

# Secrets (Set via CLI: npx wrangler secret put TELEGRAM_BOT_TOKEN)
# Do NOT hardcode tokens here.
